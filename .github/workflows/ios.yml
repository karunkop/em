name: BrowserStack

on:
  push:
    branches:
      - main
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      rerun_id:
        description: 'Optional ID for tracking repeated runs'
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true
  COPILOT_AGENT_FIREWALL_ALLOW_LIST_ADDITIONS: googlechromelabs.github.io,storage.googleapis.com
  # Activates the console proxy (src/util/consoleProxy.ts), which we need because BrowserStack
  # can't access iOS console logs.
  VITE_BROWSER_CONSOLE_CAPTURE: 1

jobs:
  run:
    name: BrowserStack
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request_target' || github.event.pull_request.changed_files > 0

    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          ref: ${{github.event.pull_request.head.ref}}
          repository: ${{github.event.pull_request.head.repo.full_name}}

      - name: Enable Corepack
        run: corepack enable

      - name: Set Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install npm dependencies
        run: yarn

      - name: Build
        run: yarn build

      - name: Serve
        run: yarn servebuild &

      - name: Test iOS on BrowserStack
        # Workflow-level retry around `yarn test:ios` because WDIO's own
        # specFileRetries cannot recover from BROWSERSTACK_QUEUE_SIZE_EXCEEDED
        # errors that happen at WebDriver session init (before the worker can
        # report sessionStarted, so the launcher's retries counter stays at -1
        # and the spec is never re-queued — see
        # https://github.com/webdriverio/webdriverio/issues/5807 and
        # packages/wdio-cli/src/launcher.ts:_endHandler).
        #
        # Queue exhaustion happens transiently when several PR builds hit the
        # shared BrowserStack account quota at once. Sleeping 60s and retrying
        # the whole `yarn test:ios` command reliably clears it because every
        # other CI run completes within ~2 minutes.
        #
        # We allow up to 3 total attempts, with the next attempt only running
        # if the previous one failed. A passing first (or second) attempt
        # short-circuits via `exit 0` so we don't waste BrowserStack minutes.
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "===== Attempt $attempt of 3: yarn test:ios ====="
            yarn test:ios
            status=$?
            if [ $status -eq 0 ]; then
              echo "===== Attempt $attempt succeeded ====="
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              echo "===== Attempt $attempt failed (exit $status); sleeping 60s before retry ====="
              sleep 60
            fi
          done
          echo "===== All 3 attempts failed ====="
          exit 1
        env:
          # BrowserStack credentials - WDIO's browserstack-service handles the tunnel
          BROWSERSTACK_USERNAME: ${{secrets.BROWSERSTACK_USERNAME}}
          BROWSERSTACK_ACCESS_KEY: ${{secrets.BROWSERSTACK_ACCESS_KEY}}
          BROWSERSTACK_BUILD_NAME: 'CI - ${{github.run_id}}'
          BROWSERSTACK_PROJECT_NAME: 'em'
